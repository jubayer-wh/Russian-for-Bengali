<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Russian for Bengali - Mobile Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 py-8 px-4">
    <main class="mx-auto w-[360px] rounded-[2.2rem] bg-white p-4 shadow-2xl ring-1 ring-slate-200">
      <div class="space-y-6">
        <section class="rounded-3xl bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-400 p-6 text-white shadow-lg transition duration-300 hover:scale-[1.01] hover:shadow-xl">
          <div class="flex items-start justify-between">
            <span class="rounded-full bg-white/25 px-3 py-1 text-xs font-semibold tracking-wide">Welcome</span>
            <span class="text-2xl">🌟</span>
          </div>
          <h1 class="mt-5 text-3xl font-extrabold leading-tight">Learn Russian 🇷🇺</h1>
          <p class="mt-2 text-base font-medium text-white/90">For Bengali Speakers 🇧🇩</p>
          <p class="mt-3 text-sm text-white/80">Speak Russian, think in Bengali</p>
          <button class="mt-6 w-full rounded-2xl bg-white py-3 text-sm font-bold text-indigo-600 shadow-md transition duration-300 hover:-translate-y-0.5 hover:bg-indigo-50 active:scale-95">
            Get Started
          </button>
        </section>

        <section class="rounded-3xl bg-slate-50 p-5 shadow-md ring-1 ring-slate-100 transition duration-300 hover:shadow-lg">
          <div class="mb-4 flex items-center justify-between">
            <h2 class="text-lg font-bold text-slate-800">Lesson</h2>
            <span class="rounded-full bg-indigo-100 px-3 py-1 text-xs font-semibold text-indigo-700">Unit 1</span>
          </div>

          <div class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Russian Word</p>
            <p class="mt-2 text-2xl font-bold text-slate-900">Здравствуйте</p>
            <div class="mt-3 flex items-center justify-between">
              <div>
                <p class="text-xs text-slate-400">Meaning</p>
                <p class="text-xl font-semibold text-emerald-600">হ্যালো</p>
              </div>
              <button class="flex h-11 w-11 items-center justify-center rounded-full bg-indigo-500 text-xl text-white shadow transition duration-300 hover:scale-105 hover:bg-indigo-600 active:scale-95">
                🔊
              </button>
            </div>
            <p class="mt-3 text-sm text-slate-500">Pronunciation: <span class="font-semibold text-slate-700">Zdravstvuyte</span></p>
          </div>

          <div class="mt-4 rounded-2xl bg-indigo-50 p-4 transition duration-300 hover:bg-indigo-100">
            <p class="text-xs font-semibold uppercase tracking-wider text-indigo-400">Example Sentence</p>
            <p class="mt-2 text-sm font-medium text-slate-700">Здравствуйте! Как дела?</p>
            <p class="mt-1 text-sm text-slate-500">হ্যালো! কেমন আছেন?</p>
          </div>
        </section>

        <section class="rounded-3xl bg-white p-5 shadow-md ring-1 ring-slate-100 transition duration-300 hover:shadow-lg">
          <div class="mb-4 flex items-center justify-between">
            <h2 class="text-lg font-bold text-slate-800">Chat Practice</h2>
            <span class="text-xl">💬</span>
          </div>

          <div class="space-y-3 rounded-2xl bg-slate-50 p-4">
            <div class="flex justify-start">
              <div class="max-w-[75%] rounded-2xl rounded-bl-md bg-indigo-500 px-4 py-2 text-sm text-white shadow">
                Привет!
              </div>
            </div>
            <div class="flex justify-end">
              <button class="max-w-[80%] rounded-2xl rounded-br-md bg-emerald-100 px-4 py-2 text-sm font-semibold text-emerald-700 shadow-sm transition duration-300 hover:bg-emerald-200 hover:scale-[1.02] active:scale-95">
                Suggested Reply: হ্যালো!
              </button>
            </div>
          </div>

          <div class="mt-4 flex items-center gap-2 rounded-2xl bg-slate-100 p-2 ring-1 ring-slate-200">
            <input
              type="text"
              placeholder="Type in Bengali..."
              class="h-10 flex-1 rounded-xl border-0 bg-white px-3 text-sm text-slate-600 placeholder:text-slate-400 focus:outline-none"
            />
            <button class="h-10 rounded-xl bg-indigo-500 px-4 text-sm font-semibold text-white transition duration-300 hover:bg-indigo-600 active:scale-95">
              Send
            </button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
